<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <title>SecureScoreLens</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F7FAFD"/>
      <stop offset="55%"  stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#EAF2FA"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0070C0"/>
      <stop offset="100%" stop-color="#00A14B"/>
    </linearGradient>
    <!-- E.E logosu govdesi. Kirmizidan turuncuya: ayni renk ailesi oldugu icin
         gecis temiz kalir ve beyaz harfler her noktada okunur (en dusuk 3.02:1).
         Dort risk rengi asagidaki seritte, birbirine karismadan durur. -->
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C00000"/>
      <stop offset="100%" stop-color="#F56A00"/>
    </linearGradient>
    <clipPath id="markClip">
      <rect x="0" y="0" width="78" height="78" rx="21"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="7" fill="#0070C0"/>

  <!-- Sol ust: E.E logosu -->
  <g transform="translate(92,44)">
    <g clip-path="url(#markClip)">
      <rect x="0" y="0" width="78" height="78" fill="url(#mark)"/>
      <!-- Dort risk rengi: kritik, yuksek, orta, dusuk -->
      <rect x="0"    y="69" width="19.5" height="9" fill="#C00000"/>
      <rect x="19.5" y="69" width="19.5" height="9" fill="#F56A00"/>
      <rect x="39"   y="69" width="19.5" height="9" fill="#FFC000"/>
      <rect x="58.5" y="69" width="19.5" height="9" fill="#00A14B"/>
    </g>
    <text x="39" y="46" text-anchor="middle" font-size="28" font-weight="800"
          letter-spacing="-.4" fill="#FFFFFF">E.E</text>
  </g>

  <!-- Sol: isim ve tanim -->
  <g transform="translate(92,172)">
    <text x="0" y="0" font-size="15" font-weight="700" letter-spacing="4.2"
          fill="#0070C0">MICROSOFT 365 · SECURE SCORE</text>

    <text x="0" y="86" font-size="76" font-weight="800" letter-spacing="-2.6"
          fill="#0F1D2E">SecureScoreLens</text>

    <rect x="0" y="118" width="86" height="5" rx="2.5" fill="#0070C0"/>

    <text x="0" y="180" font-size="31" font-weight="750" letter-spacing="-.5"
          fill="#0F1D2E">Puanı rapora, raporu aksiyona dönüştürür.</text>
    <text x="0" y="222" font-size="20" font-weight="500" fill="#4A5D75">
      Microsoft 365 güvenlik duruşunuz, sunuma hazır tek belgede.
    </text>

    <!-- Ozellik rozetleri -->
    <g transform="translate(0,258)" font-size="15.5" font-weight="700">
      <g>
        <rect x="0" y="0" width="186" height="40" rx="20"
              fill="#E6F7EC" stroke="#A8E0C0"/>
        <circle cx="24" cy="20" r="5" fill="#00A14B"/>
        <text x="40" y="26" fill="#046B34">Salt okunur erişim</text>
      </g>
      <g transform="translate(202,0)">
        <rect x="0" y="0" width="150" height="40" rx="20"
              fill="#EBF4FA" stroke="#B2D4EC"/>
        <circle cx="24" cy="20" r="5" fill="#0070C0"/>
        <text x="40" y="26" fill="#00568F">PDF çıktısı</text>
      </g>
    </g>

    <text x="0" y="352" font-size="16" fill="#5C6F87">
      PowerShell + Python · Kurulum gerektirmez · MIT lisansı
    </text>
  </g>

  <!-- Sag: puan halkasi ve bolum listesi -->
  <g transform="translate(960,300)">
    <circle cx="0" cy="0" r="132" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="2"/>
    <circle cx="0" cy="0" r="112" fill="none" stroke="#EDF2F8" stroke-width="18"/>
    <!-- 61% yay: cevre 703.7, gosterilen 429 -->
    <circle cx="0" cy="0" r="112" fill="none" stroke="url(#ring)" stroke-width="18"
            stroke-linecap="round" stroke-dasharray="429 275"
            transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" font-size="56" font-weight="800"
          letter-spacing="-2" fill="#0F1D2E">%61</text>
    <text x="0" y="36" text-anchor="middle" font-size="14.5" font-weight="700"
          letter-spacing="1.6" fill="#5C6F87">SECURE SCORE</text>
  </g>

  <!-- Risk seviyeleri seridi -->
  <g transform="translate(828,472)">
    <rect x="0"   y="0" width="60" height="10" rx="5" fill="#C00000"/>
    <rect x="68"  y="0" width="60" height="10" rx="5" fill="#F56A00"/>
    <rect x="136" y="0" width="60" height="10" rx="5" fill="#FFD500"/>
    <rect x="204" y="0" width="60" height="10" rx="5" fill="#00A14B"/>
    <text x="132" y="40" text-anchor="middle" font-size="14" font-weight="600"
          fill="#5C6F87">Kritik · Yüksek · Orta · Düşük</text>
  </g>

  <!-- Alt: bolum adlari -->
  <g transform="translate(92,556)" font-size="15" font-weight="650" fill="#4A5D75">
    <text x="0" y="0">Genel Bakış</text>
    <text x="140" y="0" fill="#B2C2D4">•</text>
    <text x="164" y="0">Tüm İyileştirme İşlemleri</text>
    <text x="404" y="0" fill="#B2C2D4">•</text>
    <text x="428" y="0">30/60/90 Yol Haritası</text>
    <text x="640" y="0" fill="#B2C2D4">•</text>
    <text x="664" y="0">İlerleme ve Kapsam</text>
    <text x="858" y="0" fill="#B2C2D4">•</text>
    <text x="882" y="0" fill="#0070C0">Bulgu Raporu</text>
  </g>
</svg>
